<style>
:root{--a:#ff3d81;--b:#7c3aed;--ink:#fff;--card:rgba(255,255,255,.16);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:Cairo,Tahoma,sans-serif;color:var(--ink)}
body{background:linear-gradient(160deg,var(--b),var(--a));background-attachment:fixed;transition:background .5s;overflow-x:hidden}
body::before,body::after{content:"";position:fixed;border-radius:50%;background:rgba(255,255,255,.1);z-index:-1}
body::before{width:260px;height:260px;top:-80px;left:-80px}
body::after{width:200px;height:200px;bottom:-60px;right:-60px}
#app{max-width:480px;margin:0 auto;padding:16px;animation:in .35s}
@keyframes in{from{opacity:0;transform:translateY(18px) scale(.97)}}
h1,h2,h3,p{margin:.3em 0}
.logo{font-size:44px;font-weight:900;text-align:center;text-shadow:0 4px 0 rgba(0,0,0,.25);animation:bob 2s infinite ease-in-out}
@keyframes bob{50%{transform:translateY(-6px) rotate(-2deg)}}
.card{background:var(--card);backdrop-filter:blur(8px);border-radius:24px;padding:16px;margin:12px 0;box-shadow:0 8px 0 rgba(0,0,0,.15)}
.btn{display:block;width:100%;border:0;border-radius:20px;padding:14px;font:800 18px Cairo,sans-serif;color:#222;background:#ffe14d;box-shadow:0 5px 0 #c9a800;margin:10px 0;cursor:pointer}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #c9a800}
.btn.g{background:#fff;box-shadow:0 5px 0 #bbb}.btn.r{background:#ff8a8a;box-shadow:0 5px 0 #c44}.btn.ok{background:#7dffb0;box-shadow:0 5px 0 #2a9d5c}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mc{border:0;border-radius:24px;padding:16px 8px;color:#fff;font:900 16px Cairo,sans-serif;cursor:pointer;box-shadow:0 7px 0 rgba(0,0,0,.25);text-align:center;transition:transform .2s}
.mc:active{transform:scale(.94)}.mc .ic{font-size:48px;display:block;filter:drop-shadow(0 4px 2px rgba(0,0,0,.3))}
.mc small{display:block;font-weight:600;opacity:.9}
.av{width:52px;height:52px;border-radius:50%;display:inline-grid;place-items:center;font-size:30px;background:#fff3;border:3px solid #fff;flex:none}
.pl{display:flex;align-items:center;gap:10px;margin:6px 0}
input,select{font:700 16px Cairo,sans-serif;border-radius:14px;border:0;padding:10px;width:100%;color:#222}
.big{font-size:26px;font-weight:900;text-align:center;padding:18px 8px}
.timer{font-size:40px;font-weight:900;text-align:center}
.bar{height:12px;background:#0003;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:#fff;transition:width 1s linear}
canvas{width:100%;height:300px;background:#fff;border-radius:20px;touch-action:none;display:block}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid #fff;display:inline-block;margin:3px}
.tag{display:inline-block;background:#0004;border-radius:12px;padding:2px 10px;font-size:13px}
.flip{animation:fl .5s}@keyframes fl{from{transform:rotateY(90deg)}}
.cf{position:fixed;top:-30px;font-size:26px;animation:fall 3s linear forwards;z-index:9;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.v{display:flex;align-items:center;gap:8px;margin:6px 0}.v .bar{flex:1}
.top{display:flex;justify-content:space-between;align-items:center;font-weight:800}
</style>
</head>

function lobby(init){if(init&&!S.p.length)S.p=['أحمد','سارة','مصطفى'].map((n,i)=>({n,a:AV[i],s:0}));
const code=S.code||(S.code=Math.random().toString(36).slice(2,7).toUpperCase());
show(`<div class="top"><h2>القعدة <span class="tag">${code} · تجريبي</span></h2></div>
<div class="card">${S.p.map((p,i)=>`<div class="pl"><span class="av" onclick="S.p[${i}].a=AV[(AV.indexOf(S.p[${i}].a)+1)%AV.length];lobby()">${p.a}</span><input value="${p.n}" onchange="S.p[${i}].n=this.value.trim()||'لاعب'">${i>0?`<button class="btn r" style="width:48px;margin:0;padding:8px" onclick="S.p.splice(${i},1);lobby()">✕</button>`:''}</div>`).join('')}

window.col=col;window.sz=sz;const c=$('#cv'),x=c.getContext('2d');x.lineCap='round';x.fillStyle='#fff';x.fillRect(0,0,600,600);let on=0;
const pt=e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)*600/r.width,(e.clientY-r.top)*600/r.height]};
c.onpointerdown=e=>{on=1;const[a,b]=pt(e);x.beginPath();x.moveTo(a,b)};c.onpointermove=e=>{if(!on)return;const[a,b]=pt(e);x.strokeStyle=window.col;x.lineWidth=window.sz*(window.col=='#fff'?3:1);x.lineTo(a,b);x.stroke()};c.onpointerup=c.onpointerleave=()=>on=0;

function gMis(){theme('mis');pass(cur(),'misGo()','اكشف مهمتي')}
function misGo(){const m=draw('mis');show(`${head()}<div class="card big flip">🤫 مهمتك السرية<br><span style="font-size:20px">${m}</span></div><p style="text-align:center">خبّي الشاشة وابدأ. الباقي ميعرفوش!</p><button class="btn g" onclick="misPlay()">خبّيتها، ابدأ التايمر</button>`,'mis')}
function misPlay(s=90){show(`${head()}<div class="card big">🕵️ ${cur().n} بينفّذ مهمة سرية…</div>${timerH()}<button class="btn ok" onclick="misRes(3)">نفّذتها ومحدش كشفني ✅</button><button class="btn" onclick="misAcc()">🔍 حد بيتهمه</button><button class="btn" onclick="misRes(1)">اتكشفت 🕵️</button><button class="btn r" onclick="misRes(0)">فشلت ❌</button>`,'mis');timer(s,()=>misRes(0))}
function misAcc(){show(`${head()}<div class="card big">مين بيتهم؟</div>${S.p.filter(x=>x!==cur()).map(x=>`<button class="btn g" onclick="misAcc2(${S.p.indexOf(x)})">${x.a} ${x.n}</button>`).join('')}<button class="btn r" onclick="misPlay(40)">رجوع</button>`,'mis')}
function misAcc2(i){show(`${head()}<div class="card big">${S.p[i].n} بيتهمك. صح؟</div><button class="btn ok" onclick="add(S.p[${i}],2);end('${S.p[i].n} كشفه +2')">أيوه اتكشفت</button><button class="btn r" onclick="add(S.p[${i}],-1);misPlay(40)">لأ، اتهام غلط (-1)</button>`,'mis')}
function misRes(n){add(cur(),n);if(n==3)confetti();end(`${cur().n} ${n==3?'+3 🎯':n?'+1':'0'}`)}

/* Mode 3 */
function gCha(){theme('cha');const[c,t,k]=draw('cha'),p=cur();S.k=k|0;const o=S.p.filter(x=>x!==p);S.pt=S.k==1?o[Math.floor(Math.random()*o.length)]:null;show(`${head()}<span class="tag">${['فردي','بين اتنين','جماعي'][S.k]}</span><div class="card big flip">🤪 ${S.k==2?'الكل':p.n+(S.pt?' + '+S.pt.n:'')}<br>${c}</div>${timerH()}<button class="btn" onclick="chaVote()">خلّصنا، صوّتوا</button><button class="btn r" onclick="add(cur(),-S.pen);end('${p.n} عدّاها (-'+S.pen+')')">تخطّي (-${S.pen} نقطة)</button>`,'cha');timer(t,chaVote)}
function chaVote(){clearInterval(T);window.y=0;window.nn=0;const f=()=>{$('#yy').textContent=y;$('#nn').textContent=nn};show(`${head()}<div class="card big">صوّتوا: نفّذها؟</div><div class="row"><button class="btn ok" onclick="y++;f()">👍 <span id="yy">0</span></button><button class="btn r" onclick="nn++;f()">👎 <span id="nn">0</span></button></div><button class="btn" onclick="chaDone()">تأكيد</button>`,'cha');window.f=f}
function chaDone(){const w=y>nn;if(w){S.k==2?S.p.forEach(x=>add(x,2)):(add(cur(),3),S.pt&&add(S.pt,3));confetti()}end(w?'نجح! 🎉':'التصويت مجاش في صالحهم')}

/* Mode 4 */
function gMind(){theme('mind');const q=draw('mind');S.q=q;S.opts=q[1]||S.p.map(p=>p.a+' '+p.n);S.v=[];S.vi=0;S.T=cur();S.pr=Math.random()<.4;S.od=S.pr?[S.T,...S.p.filter(x=>x!==S.T)]:S.p;mindTurn()}
function mindTurn(){if(S.vi>=S.od.length)return mindShow();pass(S.od[S.vi],'mindAsk()','أجاوب')}
function mindAsk(){const g=S.pr&&S.vi>0;show(`${head()}${S.pr?'<span class="tag">🔮 توقّع</span>':''}<div class="card big flip">${S.q[0]}${g?`<br><small>توقّع ${S.T.n} هيجاوب إيه؟</small>`:''}</div><p style="text-align:center">سري 🤫</p>${S.opts.map((o,i)=>`<button class="btn g" onclick="S.v.push(${i});S.vi++;mindTurn()">${o}</button>`).join('')}`,'mind')}
function mindShow(){let x='';if(S.pr){const a=S.v[0];x=`<div class="card big">${S.T.a} ${S.T.n} جاوب:<br>${S.opts[a]}</div><div class="card">${S.od.slice(1).map((p,i)=>{const ok=S.v[i+1]==a;if(ok){add(p,2);add(S.T,1)}return `<div class="pl"><span class="av">${p.a}</span><span style="flex:1">${p.n}: ${S.opts[S.v[i+1]]}</span>${ok?'✅ +2':'❌'}</div>`}).join('')}</div>`}else{const c=S.opts.map((_,i)=>S.v.filter(v=>v==i).length),mx=Math.max(...c);S.v.forEach((v,i)=>{if(c[v]==mx)add(S.p[i],2)});x=`<div class="card">${S.opts.map((o,i)=>`<div class="v"><span style="width:38%;font-size:14px">${o}</span><div class="bar"><i style="width:${c[i]/S.p.length*100}%"></i></div><b>${c[i]}</b></div>`).join('')}</div><p style="text-align:center">اللي اختار الأغلبية خد +2</p>`}confetti();show(`${head()}<div class="card big">${S.q[0]}</div>${x}<button class="btn" onclick="S.i++;score()">كمّل</button>`,'mind')}
menu();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
