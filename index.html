<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#070c2c">
<title>قعدة الصحاب</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{--a:#ff3d81;--b:#7c3aed;--ink:#fff;--card:rgba(255,255,255,.16);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:Cairo,Tahoma,sans-serif;color:var(--ink)}
body{background:linear-gradient(160deg,var(--b),var(--a));background-attachment:fixed;transition:background .5s;overflow-x:hidden}
body::before,body::after{content:"";position:fixed;border-radius:50%;background:rgba(255,255,255,.1);z-index:-1}
body::before{width:260px;height:260px;top:-80px;left:-80px}
body::after{width:200px;height:200px;bottom:-60px;right:-60px}
#app{max-width:480px;margin:0 auto;padding:16px;animation:in .35s}
@keyframes in{from{opacity:0;transform:translateY(18px) scale(.97)}}
h1,h2,h3,p{margin:.3em 0}
.logo{font-size:44px;font-weight:900;text-align:center;text-shadow:0 4px 0 rgba(0,0,0,.25);animation:bob 2s infinite ease-in-out}
@keyframes bob{50%{transform:translateY(-6px) rotate(-2deg)}}
.card{background:var(--card);backdrop-filter:blur(8px);border-radius:24px;padding:16px;margin:12px 0;box-shadow:0 8px 0 rgba(0,0,0,.15)}
.btn{display:block;width:100%;border:0;border-radius:20px;padding:14px;font:800 18px Cairo,sans-serif;color:#222;background:#ffe14d;box-shadow:0 5px 0 #c9a800;margin:10px 0;cursor:pointer}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #c9a800}
.btn.g{background:#fff;box-shadow:0 5px 0 #bbb}.btn.r{background:#ff8a8a;box-shadow:0 5px 0 #c44}.btn.ok{background:#7dffb0;box-shadow:0 5px 0 #2a9d5c}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mc{border:0;border-radius:24px;padding:16px 8px;color:#fff;font:900 16px Cairo,sans-serif;cursor:pointer;box-shadow:0 7px 0 rgba(0,0,0,.25);text-align:center;transition:transform .2s}
.mc:active{transform:scale(.94)}.mc .ic{font-size:48px;display:block;filter:drop-shadow(0 4px 2px rgba(0,0,0,.3))}
.mc small{display:block;font-weight:600;opacity:.9}
.av{width:52px;height:52px;border-radius:50%;display:inline-grid;place-items:center;font-size:30px;background:#fff3;border:3px solid #fff;flex:none}
.pl{display:flex;align-items:center;gap:10px;margin:6px 0}
input,select{font:700 16px Cairo,sans-serif;border-radius:14px;border:0;padding:10px;width:100%;color:#222}
.big{font-size:26px;font-weight:900;text-align:center;padding:18px 8px}
.timer{font-size:40px;font-weight:900;text-align:center}
.bar{height:12px;background:#0003;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:#fff;transition:width 1s linear}
canvas{width:100%;height:300px;background:#fff;border-radius:20px;touch-action:none;display:block}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid #fff;display:inline-block;margin:3px}
.tag{display:inline-block;background:#0004;border-radius:12px;padding:2px 10px;font-size:13px}
.flip{animation:fl .5s}@keyframes fl{from{transform:rotateY(90deg)}}
.cf{position:fixed;top:-30px;font-size:26px;animation:fall 3s linear forwards;z-index:9;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.v{display:flex;align-items:center;gap:8px;margin:6px 0}.v .bar{flex:1}
.top{display:flex;justify-content:space-between;align-items:center;font-weight:800}
body{background:linear-gradient(180deg,var(--b),#0b1650 42%,#070c2c);background-attachment:fixed}
.card{background:rgba(10,20,80,.55);border:2px solid rgba(255,255,255,.18);box-shadow:0 0 18px rgba(0,0,0,.35),0 6px 0 rgba(0,0,0,.3)}
.mc{display:flex;flex-direction:column;align-items:center;gap:4px;border:2px solid rgba(255,255,255,.35)}
.mc img{width:64px;height:64px;border-radius:16px;box-shadow:0 4px 8px rgba(0,0,0,.45)}
.hero{width:100%;border-radius:26px;display:block;margin-bottom:12px;border:3px solid rgba(255,255,255,.35);box-shadow:0 0 24px rgba(125,211,252,.45)}
.ai{width:30px;height:30px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-left:6px}
.av{overflow:hidden;background:#1e3a8a}.av .ai{width:100%;height:100%;margin:0}
.mi{width:34px;height:34px;border-radius:10px;vertical-align:middle;margin-left:6px}.btn .mi{width:26px;height:26px}
#sp{position:fixed;inset:0;background:radial-gradient(circle,#2b2f9a,#070c2c);display:grid;place-items:center;z-index:99;transition:opacity .5s}
#sp img{width:min(70vw,300px);animation:bob 1.4s infinite}
</style>
</head>

function actGo(){const[t,x,s]=S.a,p=cur(),g=[0,1,2,3,7].includes(t),sk=`<button class="btn r" onclick="add(cur(),-S.pen);end('${p.n} عدّاها (-'+S.pen+')')">تخطّي (-${S.pen} نقطة)</button>`;
if(g){show(`${head()}<span class="tag">${AT[t]}</span><div class="card big flip">🎭 ${x}</div><p style="text-align:center">مثّلها من غير ما تقول الإجابة!</p>${timerH()}<button class="btn" onclick="actEnd()">خلّصت</button>${sk}`,'act');timer(s,actEnd)}
else{S.k=t==5?1:0;const o=S.p.filter(y=>y!==p);S.pt=t==5?o[Math.floor(Math.random()*o.length)]:null;show(`${head()}<span class="tag">${AT[t]}</span><div class="card big flip">🎭 ${p.n}${S.pt?' + '+S.pt.n:''}<br>${x}</div>${timerH()}<button class="btn" onclick="chaVote()">خلّصنا، صوّتوا</button>${sk}`,'act');timer(s,chaVote)}}
function actEnd(){clearInterval(T);const d=cur();show(`${head()}<div class="card big">مين خمّن صح؟</div>${S.p.filter(p=>p!==d).map(p=>`<button class="btn g" onclick="actWin(${S.p.indexOf(p)})">${p.a} ${p.n}</button>`).join('')}<button class="btn r" onclick="end('محدش خمّن 😅')">محدش</button>`,'act')}
function actWin(i){add(S.p[i],3);add(cur(),2);confetti();end(`${S.p[i].a} ${S.p[i].n} +3 · ${cur().n} +2`)}
function gFoot(){theme('foot');S.q=draw('foot');S.n=1;footShow()}
function footShow(){const[l,a,c]=S.q;show(`${head()}<span class="tag">${['سهل','متوسط','صعب'][l]}</span> <span class="tag">المقدّم: ${cur().n}</span><div class="card">${c.slice(0,S.n).map((x,i)=>`<div class="flip" style="font-size:19px;font-weight:800;padding:6px 0">💡 ${i+1}. ${x}</div>`).join('')}</div><details class="card"><summary style="font-weight:800">👁 الإجابة (للمقدّم بس)</summary>${a}</details><p style="text-align:center">نقط الإجابة دلوقتي: ${Math.max(2,6-S.n)}</p>${S.n<c.length?`<button class="btn" onclick="S.n++;footShow()">💡 تلميح تاني</button>`:''}<div class="card"><b>مين جاوب صح؟</b>${S.p.filter(p=>p!==cur()).map(p=>`<button class="btn g" onclick="footWin(${S.p.indexOf(p)})">${p.a} ${p.n}</button>`).join('')}</div><button class="btn r" onclick="end('محدش عرف. الإجابة: '+S.q[1])">محدش عرف</button>`,'foot')}
function footWin(i){const n=Math.max(2,6-S.n);add(S.p[i],n);add(cur(),1);confetti();end(`${S.p[i].a} ${S.p[i].n} +${n} · الإجابة: ${S.q[1]}`)}
const deck={};const draw=k=>{if(!deck[k]||!deck[k].length)deck[k]=[...D[k]].sort(()=>Math.random()-.5);return deck[k].pop()};
const AV=['[[a0]]','[[a1]]','[[a2]]','[[a3]]','[[a4]]','[[a5]]'];
const S={pen:2,mute:false,p:[],rounds:5,sel:[0,1,2,3,4,5],rand:true,i:0,r:0,mode:null};
let T=null;
const theme=k=>{const t=TH[k];document.documentElement.style.setProperty('--a',t[1]);document.documentElement.style.setProperty('--b',t[0])};
const show=(h,k)=>{clearInterval(T);if(k)theme(k);app.innerHTML=h.replace(/(<[^>]*>)|\[\[a(\d)\]\]/g,(m,t,i)=>t||`<img class="ai" src="${IMG.av[i]}">`);app.style.animation='none';app.offsetHeight;app.style.animation=''};
const timer=(sec,cb)=>{let t=sec;const u=()=>{$('#tm').textContent=t;$('#tb').style.width=(t/sec*100)+'%'};u();T=setInterval(()=>{t--;u();if(t<=0){clearInterval(T);cb&&cb()}},1000)};
const timerH=()=>'<div class="timer" id="tm"></div><div class="bar"><i id="tb" style="width:100%"></i></div>';
const cur=()=>S.p[S.i%S.p.length];
const add=(p,n)=>{p.s+=n};
const confetti=()=>{beep(880,.3);for(let i=0;i<40;i++){const e=document.createElement('div');e.className='cf';e.textContent=['🎉','✨','🎊','⭐'][i%4];e.style.left=Math.random()*100+'vw';e.style.animationDelay=Math.random()*1.2+'s';document.body.appendChild(e);setTimeout(()=>e.remove(),4500)}};
const pass=(who,go,label)=>show(`<div class="card big flip">📱<br>ادّي الموبايل لـ<br><span class="av">${who.a}</span> ${who.n}</div><button class="btn" onclick="${go}">${label||'أنا جاهز'}</button>`);

function menu(){show(`<img class="hero" src="${IMG.hero}" alt="قعدة الصحاب">
<div class="modes">${MODES.map((m,i)=>`<button class="mc" style="background:linear-gradient(150deg,${TH[m.k][0]},${TH[m.k][1]})" onclick="info(${i})"><img src="${IMG.ic[m.k]}" alt="">${m.n}<small>${m.d}</small></button>`).join('')}</div>
<button class="btn" onclick="lobby(true)">➕ اعمل قعدة</button><button class="btn g" onclick="joinRoom()">🔑 ادخل بكود</button>
<div class="card" style="font-size:14px">⚠️ ده وضع تجريبي على موبايل واحد (بتعدّوه بينكم). اللعب أونلاين محتاج سيرفر لسه مش متوصّل.</div>`,'menu')}
function info(i){const m=MODES[i];show(`<div class="card big flip"><img src="${IMG.ic[m.k]}" style="width:110px;border-radius:26px" alt="">${m.n}<p style="font-size:16px">${m.d}</p></div><button class="btn g" onclick="menu()">رجوع</button>`,m.k)}
function joinRoom(){show(`<div class="card"><h2>ادخل بكود</h2><input id="cd" placeholder="كود القعدة" maxlength="5"><button class="btn" onclick="$('#er').textContent='الأونلاين لسه مش متوصّل بسيرفر. استخدم القعدة المحلية.'">ادخل</button><p id="er" style="color:#ffd"></p></div><button class="btn g" onclick="menu()">رجوع</button>`,'menu')}
function lobby(init){if(init&&!S.p.length)S.p=['أحمد','سارة','مصطفى'].map((n,i)=>({n,a:AV[i],s:0}));
const code=S.code||(S.code=Math.random().toString(36).slice(2,7).toUpperCase());
show(`<div class="top"><h2>القعدة <span class="tag">${code} · تجريبي</span></h2></div>
<div class="card">${S.p.map((p,i)=>`<div class="pl"><span class="av" onclick="S.p[${i}].a=AV[(AV.indexOf(S.p[${i}].a)+1)%AV.length];lobby()">${p.a}</span><input value="${p.n}" onchange="S.p[${i}].n=this.value.trim()||'لاعب'">${i>0?`<button class="btn r" style="width:48px;margin:0;padding:8px" onclick="S.p.splice(${i},1);lobby()">✕</button>`:''}</div>`).join('')}
${S.p.length<12?`<button class="btn g" onclick="S.p.push({n:'لاعب '+(S.p.length+1),a:AV[S.p.length%AV.length],s:0});lobby()">+ لاعب (${S.p.length}/12)</button>`:''}<small>دوس على الأفاتار عشان تغيّره</small></div>
<div class="card"><b>عدد الجولات</b><select onchange="S.rounds=+this.value">${[3,5,8,10,12].map(n=>`<option ${n==S.rounds?'selected':''}>${n}</option>`).join('')}</select>
<p><b>الألعاب</b></p><div class="row">${MODES.map((m,i)=>`<button class="btn ${S.sel.includes(i)?'ok':'g'}" style="padding:8px;font-size:14px" onclick="S.sel=S.sel.includes(${i})?S.sel.filter(x=>x!=${i}):[...S.sel,${i}];if(!S.sel.length)S.sel=[${i}];lobby()"><img class="mi" src="${IMG.ic[m.k]}" alt="">${m.n}</button>`).join('')}</div></div>
<div class="card"><b>خصم التخطّي</b><select onchange="S.pen=+this.value">${[1,2,3,5].map(n=>`<option ${n==S.pen?'selected':''}>${n}</option>`).join('')}</select><button class="btn g" onclick="S.mute=!S.mute;lobby()">${S.mute?'🔇 الصوت مقفول':'🔊 الصوت شغّال'}</button><input id="cq" placeholder="اكتب سؤال أو تحدي من عندكم"><div class="row"><button class="btn g" onclick="addQ(0,this)">+ سؤال</button><button class="btn g" onclick="addQ(1,this)">+ تحدي</button></div></div><button class="btn" onclick="start()" ${S.p.length<3?'disabled':''}>🚀 ابدأ (محتاج 3 على الأقل)</button><button class="btn g" onclick="menu()">خروج</button>`,'menu')}
function start(){if(S.p.length<3)return;S.p.forEach(p=>p.s=0);S.i=0;S.r=0;next()}
function next(){if(S.r>=S.rounds)return final();const m=MODES[S.sel[S.rand?Math.floor(Math.random()*S.sel.length):S.r%S.sel.length]];S.mode=m;S.r++;({draw:gDraw,mis:gMis,cha:gCha,mind:gMind,act:gAct,foot:gFoot})[m.k]()}
function head(){return `<div class="top"><span><img class="mi" src="${IMG.ic[S.mode.k]}" alt="">${S.mode.n}</span><span class="tag">جولة ${S.r}/${S.rounds}</span></div>`}
function end(msg){S.i++;score(msg)}
function score(msg){const s=[...S.p].sort((a,b)=>b.s-a.s);show(`<h2 style="text-align:center">🏆 النتيجة</h2>${msg?`<div class="card">${msg}</div>`:''}<div class="card">${s.map((p,i)=>`<div class="pl"><b>${i+1}</b><span class="av">${p.a}</span><span style="flex:1">${p.n}</span><b>${p.s}</b></div>`).join('')}</div><button class="btn" onclick="next()">${S.r>=S.rounds?'🏁 النتيجة النهائية':'الجولة الجاية ▶'}</button>`,'menu')}
function final(){const s=[...S.p].sort((a,b)=>b.s-a.s);show(`<div class="logo">🏆</div><div class="card big flip"><span class="av" style="width:90px;height:90px;font-size:56px">${s[0].a}</span><br>${s[0].n} كسب!<br><small>${s[0].s} نقطة</small></div><div class="card">${s.map((p,i)=>`<div class="pl"><b>${i+1}</b><span class="av">${p.a}</span><span style="flex:1">${p.n}</span><b>${p.s}</b></div>`).join('')}</div><button class="btn" onclick="start()">🔁 العب تاني</button><button class="btn g" onclick="menu()">القايمة</button>`,'menu');confetti()}

/* Mode 1 */
function gDraw(){const d=cur();theme('draw');pass(d,'drawGo()','وريني الكلمة')}
function drawGo(){const d=cur(),w=draw('draw');let col='#222',sz=5;
show(`${head()}<div class="card"><b>ارسم:</b> <span class="tag" style="font-size:18px">${w}</span></div>${timerH()}<canvas id="cv" width="600" height="600"></canvas>
<div>${['#222','#e11d48','#2563eb','#16a34a','#f59e0b','#fff'].map(c=>`<span class="sw" style="background:${c}" onclick="window.col='${c}'"></span>`).join('')}</div>
<div class="row"><button class="btn g" onclick="window.sz=4">رفيع</button><button class="btn g" onclick="window.sz=14">سميك</button><button class="btn r" onclick="clr()">مسح</button></div><button class="btn ok" onclick="drawEnd()">خلّصت ✔</button>`,'draw');
window.col=col;window.sz=sz;const c=$('#cv'),x=c.getContext('2d');x.lineCap='round';x.fillStyle='#fff';x.fillRect(0,0,600,600);let on=0;
const pt=e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)*600/r.width,(e.clientY-r.top)*600/r.height]};
c.onpointerdown=e=>{on=1;const[a,b]=pt(e);x.beginPath();x.moveTo(a,b)};c.onpointermove=e=>{if(!on)return;const[a,b]=pt(e);x.strokeStyle=window.col;x.lineWidth=window.sz*(window.col=='#fff'?3:1);x.lineTo(a,b);x.stroke()};c.onpointerup=c.onpointerleave=()=>on=0;
window.clr=()=>{x.fillStyle='#fff';x.fillRect(0,0,600,600)};timer(60,drawEnd)}
function drawEnd(){clearInterval(T);const d=cur();show(`${head()}<div class="card big">مين خمّن صح؟</div>${S.p.filter(p=>p!==d).map(p=>`<button class="btn g" onclick="drawWin(${S.p.indexOf(p)})"><span class="av" style="width:34px;height:34px;font-size:20px">${p.a}</span> ${p.n}</button>`).join('')}<button class="btn r" onclick="end('محدش خمّن 😅')">محدش</button>`,'draw')}
function drawWin(i){add(S.p[i],3);add(cur(),2);confetti();end(`${S.p[i].a} ${S.p[i].n} +3 · ${cur().n} +2`)}

/* Mode 2 */
function gMis(){theme('mis');pass(cur(),'misGo()','اكشف مهمتي')}
function misGo(){const m=draw('mis');show(`${head()}<div class="card big flip">🤫 مهمتك السرية<br><span style="font-size:20px">${m}</span></div><p style="text-align:center">خبّي الشاشة وابدأ. الباقي ميعرفوش!</p><button class="btn g" onclick="misPlay()">خبّيتها، ابدأ التايمر</button>`,'mis')}
function misPlay(s=90){show(`${head()}<div class="card big">🕵️ ${cur().n} بينفّذ مهمة سرية…</div>${timerH()}<button class="btn ok" onclick="misRes(3)">نفّذتها ومحدش كشفني ✅</button><button class="btn" onclick="misAcc()">🔍 حد بيتهمه</button><button class="btn" onclick="misRes(1)">اتكشفت 🕵️</button><button class="btn r" onclick="misRes(0)">فشلت ❌</button>`,'mis');timer(s,()=>misRes(0))}
function misAcc(){show(`${head()}<div class="card big">مين بيتهم؟</div>${S.p.filter(x=>x!==cur()).map(x=>`<button class="btn g" onclick="misAcc2(${S.p.indexOf(x)})">${x.a} ${x.n}</button>`).join('')}<button class="btn r" onclick="misPlay(40)">رجوع</button>`,'mis')}
function misAcc2(i){show(`${head()}<div class="card big">${S.p[i].n} بيتهمك. صح؟</div><button class="btn ok" onclick="add(S.p[${i}],2);end('${S.p[i].n} كشفه +2')">أيوه اتكشفت</button><button class="btn r" onclick="add(S.p[${i}],-1);misPlay(40)">لأ، اتهام غلط (-1)</button>`,'mis')}
function misRes(n){add(cur(),n);if(n==3)confetti();end(`${cur().n} ${n==3?'+3 🎯':n?'+1':'0'}`)}

/* Mode 3 */
function gCha(){theme('cha');const[c,t,k]=draw('cha'),p=cur();S.k=k|0;const o=S.p.filter(x=>x!==p);S.pt=S.k==1?o[Math.floor(Math.random()*o.length)]:null;show(`${head()}<span class="tag">${['فردي','بين اتنين','جماعي'][S.k]}</span><div class="card big flip">🤪 ${S.k==2?'الكل':p.n+(S.pt?' + '+S.pt.n:'')}<br>${c}</div>${timerH()}<button class="btn" onclick="chaVote()">خلّصنا، صوّتوا</button><button class="btn r" onclick="add(cur(),-S.pen);end('${p.n} عدّاها (-'+S.pen+')')">تخطّي (-${S.pen} نقطة)</button>`,'cha');timer(t,chaVote)}
function chaVote(){clearInterval(T);window.y=0;window.nn=0;const f=()=>{$('#yy').textContent=y;$('#nn').textContent=nn};show(`${head()}<div class="card big">صوّتوا: نفّذها؟</div><div class="row"><button class="btn ok" onclick="y++;f()">👍 <span id="yy">0</span></button><button class="btn r" onclick="nn++;f()">👎 <span id="nn">0</span></button></div><button class="btn" onclick="chaDone()">تأكيد</button>`,'cha');window.f=f}
function chaDone(){const w=y>nn;if(w){S.k==2?S.p.forEach(x=>add(x,2)):(add(cur(),3),S.pt&&add(S.pt,3));confetti()}end(w?'نجح! 🎉':'التصويت مجاش في صالحهم')}

/* Mode 4 */
function gMind(){theme('mind');const q=draw('mind');S.q=q;S.opts=q[1]||S.p.map(p=>p.a+' '+p.n);S.v=[];S.vi=0;S.T=cur();S.pr=Math.random()<.4;S.od=S.pr?[S.T,...S.p.filter(x=>x!==S.T)]:S.p;mindTurn()}
function mindTurn(){if(S.vi>=S.od.length)return mindShow();pass(S.od[S.vi],'mindAsk()','أجاوب')}
function mindAsk(){const g=S.pr&&S.vi>0;show(`${head()}${S.pr?'<span class="tag">🔮 توقّع</span>':''}<div class="card big flip">${S.q[0]}${g?`<br><small>توقّع ${S.T.n} هيجاوب إيه؟</small>`:''}</div><p style="text-align:center">سري 🤫</p>${S.opts.map((o,i)=>`<button class="btn g" onclick="S.v.push(${i});S.vi++;mindTurn()">${o}</button>`).join('')}`,'mind')}
function mindShow(){let x='';if(S.pr){const a=S.v[0];x=`<div class="card big">${S.T.a} ${S.T.n} جاوب:<br>${S.opts[a]}</div><div class="card">${S.od.slice(1).map((p,i)=>{const ok=S.v[i+1]==a;if(ok){add(p,2);add(S.T,1)}return `<div class="pl"><span class="av">${p.a}</span><span style="flex:1">${p.n}: ${S.opts[S.v[i+1]]}</span>${ok?'✅ +2':'❌'}</div>`}).join('')}</div>`}else{const c=S.opts.map((_,i)=>S.v.filter(v=>v==i).length),mx=Math.max(...c);S.v.forEach((v,i)=>{if(c[v]==mx)add(S.p[i],2)});x=`<div class="card">${S.opts.map((o,i)=>`<div class="v"><span style="width:38%;font-size:14px">${o}</span><div class="bar"><i style="width:${c[i]/S.p.length*100}%"></i></div><b>${c[i]}</b></div>`).join('')}</div><p style="text-align:center">اللي اختار الأغلبية خد +2</p>`}confetti();show(`${head()}<div class="card big">${S.q[0]}</div>${x}<button class="btn" onclick="S.i++;score()">كمّل</button>`,'mind')}
menu();
{const s=document.createElement('div');s.id='sp';s.innerHTML='<img src="'+IMG.logo+'" alt="">';document.body.appendChild(s);setTimeout(()=>{s.style.opacity=0;setTimeout(()=>s.remove(),500)},1500)}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
