<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>قعدة الصحاب</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{--a:#ff3d81;--b:#7c3aed;--ink:#fff;--card:rgba(255,255,255,.16);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:Cairo,Tahoma,sans-serif;color:var(--ink)}
body{background:linear-gradient(160deg,var(--b),var(--a));background-attachment:fixed;transition:background .5s;overflow-x:hidden}
body::before,body::after{content:"";position:fixed;border-radius:50%;background:rgba(255,255,255,.1);z-index:-1}
body::before{width:260px;height:260px;top:-80px;left:-80px}
body::after{width:200px;height:200px;bottom:-60px;right:-60px}
#app{max-width:480px;margin:0 auto;padding:16px;animation:in .35s}
@keyframes in{from{opacity:0;transform:translateY(18px) scale(.97)}}
h1,h2,h3,p{margin:.3em 0}
.logo{font-size:44px;font-weight:900;text-align:center;text-shadow:0 4px 0 rgba(0,0,0,.25);animation:bob 2s infinite ease-in-out}
@keyframes bob{50%{transform:translateY(-6px) rotate(-2deg)}}
.card{background:var(--card);backdrop-filter:blur(8px);border-radius:24px;padding:16px;margin:12px 0;box-shadow:0 8px 0 rgba(0,0,0,.15)}
.btn{display:block;width:100%;border:0;border-radius:20px;padding:14px;font:800 18px Cairo,sans-serif;color:#222;background:#ffe14d;box-shadow:0 5px 0 #c9a800;margin:10px 0;cursor:pointer}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #c9a800}
.btn.g{background:#fff;box-shadow:0 5px 0 #bbb}.btn.r{background:#ff8a8a;box-shadow:0 5px 0 #c44}.btn.ok{background:#7dffb0;box-shadow:0 5px 0 #2a9d5c}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mc{border:0;border-radius:24px;padding:16px 8px;color:#fff;font:900 16px Cairo,sans-serif;cursor:pointer;box-shadow:0 7px 0 rgba(0,0,0,.25);text-align:center;transition:transform .2s}
.mc:active{transform:scale(.94)}.mc .ic{font-size:48px;display:block;filter:drop-shadow(0 4px 2px rgba(0,0,0,.3))}
.mc small{display:block;font-weight:600;opacity:.9}
.av{width:52px;height:52px;border-radius:50%;display:inline-grid;place-items:center;font-size:30px;background:#fff3;border:3px solid #fff;flex:none}
.pl{display:flex;align-items:center;gap:10px;margin:6px 0}
input,select{font:700 16px Cairo,sans-serif;border-radius:14px;border:0;padding:10px;width:100%;color:#222}
.big{font-size:26px;font-weight:900;text-align:center;padding:18px 8px}
.timer{font-size:40px;font-weight:900;text-align:center}
.bar{height:12px;background:#0003;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:#fff;transition:width 1s linear}
canvas{width:100%;height:300px;background:#fff;border-radius:20px;touch-action:none;display:block}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid #fff;display:inline-block;margin:3px}
.tag{display:inline-block;background:#0004;border-radius:12px;padding:2px 10px;font-size:13px}
.flip{animation:fl .5s}@keyframes fl{from{transform:rotateY(90deg)}}
.cf{position:fixed;top:-30px;font-size:26px;animation:fall 3s linear forwards;z-index:9;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.v{display:flex;align-items:center;gap:8px;margin:6px 0}.v .bar{flex:1}
.top{display:flex;justify-content:space-between;align-items:center;font-weight:800}
</style>
</head>
<body>
<div id="app"></div>
<script>
const $=s=>document.querySelector(s),app=$('#app');
const TH={menu:['#7c3aed','#ff3d81'],draw:['#0ea5e9','#6366f1'],mis:['#111827','#7c3aed'],cha:['#f97316','#ef4444'],mind:['#10b981','#0891b2']};
const MODES=[{k:'draw',n:'وصّلها لو تقدر',i:'🎨',d:'ارسم وخلّيهم يخمنوا'},{k:'mis',n:'المهمة السرية',i:'🕵️',d:'مهمة محدش يعرفها'},{k:'cha',n:'ورّط صاحبك',i:'🤪',d:'تحديات تضحّك'},{k:'mind',n:'اقرأ دماغي',i:'🧠',d:'مين فينا؟'}];
/* Seed content (demo). Production: load from /content/*.json */
const D={
draw:['كشري','فيلم اللمبي','ميكروباص','"اللي اختشوا ماتوا"','عربية فول','ترزي','"القرد في عين أمه غزال"','شاي بلبن','أسانسير','فرح شعبي','زحمة المعادي','موبايل بيفصل شحن'],
mis:['خلّي حد يقول كلمة "بصراحة"','خلّي حد يضحك من غير ما تحكي نكتة','خلّي حد يسألك سؤال عن الأكل','قول كلمة "طبعًا" خمس مرات بشكل طبيعي','خلّي حد يغيّر مكانه','خلّي حد يذكر اسم مسلسل','خلّي حد يقولك "معلش"','خلّي حد يتكلم عن الجو'],
cha:[['قلّد واحد من صحابك لحد ما يخمنوه',30],['اعلن عن كوباية مايه كأنها منتج بملايين',40],['اتكلم دقيقة من غير حرف الألف',45],['اتخيل نفسك مذيع نشرة أخبار وقول خبر مضحك',30],['غنّي أغنية بصوت كارتون',25],['قول خمس أكلات في خمس ثواني',10],['احكي قصة بتلات كلمات بس كل مرة',30],['اتصرف كأنك ممثل في مشهد درامي بسبب فقدان الشاحن',30]],
mind:[['مين أكتر واحد ممكن يتأخر على فرحه؟'],['مين فينا ممكن يصرف فلوسه في يوم واحد؟'],['مين أكتر واحد بيضحك في وقت غلط؟'],['مين ممكن يبقى مشهور؟'],['مين أكتر واحد بيرد متأخر على الواتس؟'],['تختار تعيش من غير موبايل ولا من غير إنترنت؟',['من غير موبايل','من غير إنترنت']],['لو كسبت مليون جنيه هتعمل إيه الأول؟',['أسافر','أشتري عربية','أقعد في البيت']],['تاكل كشري كل يوم ولا فول كل يوم؟',['كشري','فول']]]};
const deck={};const draw=k=>{if(!deck[k]||!deck[k].length)deck[k]=[...D[k]].sort(()=>Math.random()-.5);return deck[k].pop()};
const AV=['😎','🤓','🥳','😜','🤠','😺','🦊','🐼','🤡','👻','🧞','🦄'];
const S={p:[],rounds:5,sel:[0,1,2,3],rand:true,i:0,r:0,mode:null};
let T=null;
const theme=k=>{const t=TH[k];document.documentElement.style.setProperty('--a',t[1]);document.documentElement.style.setProperty('--b',t[0])};
const show=(h,k)=>{clearInterval(T);if(k)theme(k);app.innerHTML=h;app.style.animation='none';app.offsetHeight;app.style.animation=''};
const timer=(sec,cb)=>{let t=sec;const u=()=>{$('#tm').textContent=t;$('#tb').style.width=(t/sec*100)+'%'};u();T=setInterval(()=>{t--;u();if(t<=0){clearInterval(T);cb&&cb()}},1000)};
const timerH=()=>'<div class="timer" id="tm"></div><div class="bar"><i id="tb" style="width:100%"></i></div>';
const cur=()=>S.p[S.i%S.p.length];
const add=(p,n)=>{p.s+=n};
const confetti=()=>{for(let i=0;i<40;i++){const e=document.createElement('div');e.className='cf';e.textContent=['🎉','✨','🎊','⭐'][i%4];e.style.left=Math.random()*100+'vw';e.style.animationDelay=Math.random()*1.2+'s';document.body.appendChild(e);setTimeout(()=>e.remove(),4500)}};
const pass=(who,go,label)=>show(`<div class="card big flip">📱<br>ادّي الموبايل لـ<br><span class="av">${who.a}</span> ${who.n}</div><button class="btn" onclick="${go}">${label||'أنا جاهز'}</button>`);

function menu(){show(`<div class="logo">🎉 قعدة الصحاب 🎉</div><p style="text-align:center">لعبة الصحاب اللي هتفرّط من الضحك</p>
<div class="modes">${MODES.map((m,i)=>`<button class="mc" style="background:linear-gradient(150deg,${TH[m.k][0]},${TH[m.k][1]})" onclick="info(${i})"><span class="ic">${m.i}</span>${m.n}<small>${m.d}</small></button>`).join('')}</div>
<button class="btn" onclick="lobby(true)">➕ اعمل قعدة</button><button class="btn g" onclick="joinRoom()">🔑 ادخل بكود</button>
<div class="card" style="font-size:14px">⚠️ ده وضع تجريبي على موبايل واحد (بتعدّوه بينكم). اللعب أونلاين محتاج سيرفر لسه مش متوصّل.</div>`,'menu')}
function info(i){const m=MODES[i];show(`<div class="card big flip"><div style="font-size:70px">${m.i}</div>${m.n}<p style="font-size:16px">${m.d}</p></div><button class="btn g" onclick="menu()">رجوع</button>`,m.k)}
function joinRoom(){show(`<div class="card"><h2>ادخل بكود</h2><input id="cd" placeholder="كود القعدة" maxlength="5"><button class="btn" onclick="$('#er').textContent='الأونلاين لسه مش متوصّل بسيرفر. استخدم القعدة المحلية.'">ادخل</button><p id="er" style="color:#ffd"></p></div><button class="btn g" onclick="menu()">رجوع</button>`,'menu')}
function lobby(init){if(init&&!S.p.length)S.p=['أحمد','سارة','مصطفى'].map((n,i)=>({n,a:AV[i],s:0}));
const code=S.code||(S.code=Math.random().toString(36).slice(2,7).toUpperCase());
show(`<div class="top"><h2>القعدة <span class="tag">${code} · تجريبي</span></h2></div>
<div class="card">${S.p.map((p,i)=>`<div class="pl"><span class="av" onclick="S.p[${i}].a=AV[(AV.indexOf(S.p[${i}].a)+1)%AV.length];lobby()">${p.a}</span><input value="${p.n}" onchange="S.p[${i}].n=this.value.trim()||'لاعب'">${i>0?`<button class="btn r" style="width:48px;margin:0;padding:8px" onclick="S.p.splice(${i},1);lobby()">✕</button>`:''}</div>`).join('')}
${S.p.length<12?`<button class="btn g" onclick="S.p.push({n:'لاعب '+(S.p.length+1),a:AV[S.p.length%12],s:0});lobby()">+ لاعب (${S.p.length}/12)</button>`:''}<small>دوس على الأفاتار عشان تغيّره</small></div>
<div class="card"><b>عدد الجولات</b><select onchange="S.rounds=+this.value">${[3,5,8,10,12].map(n=>`<option ${n==S.rounds?'selected':''}>${n}</option>`).join('')}</select>
<p><b>الألعاب</b></p><div class="row">${MODES.map((m,i)=>`<button class="btn ${S.sel.includes(i)?'ok':'g'}" style="padding:8px;font-size:14px" onclick="S.sel=S.sel.includes(${i})?S.sel.filter(x=>x!=${i}):[...S.sel,${i}];if(!S.sel.length)S.sel=[${i}];lobby()">${m.i} ${m.n}</button>`).join('')}</div></div>
<button class="btn" onclick="start()" ${S.p.length<3?'disabled':''}>🚀 ابدأ (محتاج 3 على الأقل)</button><button class="btn g" onclick="menu()">خروج</button>`,'menu')}
function start(){if(S.p.length<3)return;S.p.forEach(p=>p.s=0);S.i=0;S.r=0;next()}
function next(){if(S.r>=S.rounds)return final();const m=MODES[S.sel[S.rand?Math.floor(Math.random()*S.sel.length):S.r%S.sel.length]];S.mode=m;S.r++;({draw:gDraw,mis:gMis,cha:gCha,mind:gMind})[m.k]()}
function head(){return `<div class="top"><span>${S.mode.i} ${S.mode.n}</span><span class="tag">جولة ${S.r}/${S.rounds}</span></div>`}
function end(msg){S.i++;score(msg)}
function score(msg){const s=[...S.p].sort((a,b)=>b.s-a.s);show(`<h2 style="text-align:center">🏆 النتيجة</h2>${msg?`<div class="card">${msg}</div>`:''}<div class="card">${s.map((p,i)=>`<div class="pl"><b>${i+1}</b><span class="av">${p.a}</span><span style="flex:1">${p.n}</span><b>${p.s}</b></div>`).join('')}</div><button class="btn" onclick="next()">${S.r>=S.rounds?'🏁 النتيجة النهائية':'الجولة الجاية ▶'}</button>`,'menu')}
function final(){const s=[...S.p].sort((a,b)=>b.s-a.s);show(`<div class="logo">🏆</div><div class="card big flip"><span class="av" style="width:90px;height:90px;font-size:56px">${s[0].a}</span><br>${s[0].n} كسب!<br><small>${s[0].s} نقطة</small></div><div class="card">${s.map((p,i)=>`<div class="pl"><b>${i+1}</b><span class="av">${p.a}</span><span style="flex:1">${p.n}</span><b>${p.s}</b></div>`).join('')}</div><button class="btn" onclick="start()">🔁 العب تاني</button><button class="btn g" onclick="menu()">القايمة</button>`,'menu');confetti()}

/* Mode 1 */
function gDraw(){const d=cur();theme('draw');pass(d,'drawGo()','وريني الكلمة')}
function drawGo(){const d=cur(),w=draw('draw');let col='#222',sz=5;
show(`${head()}<div class="card"><b>ارسم:</b> <span class="tag" style="font-size:18px">${w}</span></div>${timerH()}<canvas id="cv" width="600" height="600"></canvas>
<div>${['#222','#e11d48','#2563eb','#16a34a','#f59e0b','#fff'].map(c=>`<span class="sw" style="background:${c}" onclick="window.col='${c}'"></span>`).join('')}</div>
<div class="row"><button class="btn g" onclick="window.sz=4">رفيع</button><button class="btn g" onclick="window.sz=14">سميك</button><button class="btn r" onclick="clr()">مسح</button></div><button class="btn ok" onclick="drawEnd()">خلّصت ✔</button>`,'draw');
window.col=col;window.sz=sz;const c=$('#cv'),x=c.getContext('2d');x.lineCap='round';x.fillStyle='#fff';x.fillRect(0,0,600,600);let on=0;
const pt=e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)*600/r.width,(e.clientY-r.top)*600/r.height]};
c.onpointerdown=e=>{on=1;const[a,b]=pt(e);x.beginPath();x.moveTo(a,b)};c.onpointermove=e=>{if(!on)return;const[a,b]=pt(e);x.strokeStyle=window.col;x.lineWidth=window.sz*(window.col=='#fff'?3:1);x.lineTo(a,b);x.stroke()};c.onpointerup=c.onpointerleave=()=>on=0;
window.clr=()=>{x.fillStyle='#fff';x.fillRect(0,0,600,600)};timer(60,drawEnd)}
function drawEnd(){clearInterval(T);const d=cur();show(`${head()}<div class="card big">مين خمّن صح؟</div>${S.p.filter(p=>p!==d).map(p=>`<button class="btn g" onclick="drawWin(${S.p.indexOf(p)})"><span class="av" style="width:34px;height:34px;font-size:20px">${p.a}</span> ${p.n}</button>`).join('')}<button class="btn r" onclick="end('محدش خمّن 😅')">محدش</button>`,'draw')}
function drawWin(i){add(S.p[i],3);add(cur(),2);confetti();end(`${S.p[i].a} ${S.p[i].n} +3 · ${cur().n} +2`)}

/* Mode 2 */
function gMis(){theme('mis');pass(cur(),'misGo()','اكشف مهمتي')}
function misGo(){const m=draw('mis');show(`${head()}<div class="card big flip">🤫 مهمتك السرية<br><span style="font-size:20px">${m}</span></div><p style="text-align:center">خبّي الشاشة وابدأ. الباقي ميعرفوش!</p><button class="btn g" onclick="misPlay()">خبّيتها، ابدأ التايمر</button>`,'mis')}
function misPlay(){show(`${head()}<div class="card big">🕵️ ${cur().n} بينفّذ مهمة سرية…</div>${timerH()}<button class="btn ok" onclick="misRes(3)">نفّذتها ومحدش كشفني ✅</button><button class="btn" onclick="misRes(1)">اتكشفت 🕵️</button><button class="btn r" onclick="misRes(0)">فشلت ❌</button>`,'mis');timer(90,()=>misRes(0))}
function misRes(n){add(cur(),n);if(n==3)confetti();end(`${cur().n} ${n==3?'+3 🎯':n?'+1':'0'}`)}

/* Mode 3 */
function gCha(){theme('cha');const[c,t]=draw('cha'),p=cur();show(`${head()}<div class="card big flip">🤪 ${p.n}<br>${c}</div>${timerH()}<button class="btn" onclick="chaVote()">خلّصت، صوّتوا</button><button class="btn r" onclick="add(cur(),-2);end('${p.n} عدّاها (-2)')">تخطّي (-2 نقطة)</button>`,'cha');timer(t,chaVote)}
function chaVote(){clearInterval(T);window.y=0;window.nn=0;const f=()=>{$('#yy').textContent=y;$('#nn').textContent=nn};show(`${head()}<div class="card big">صوّتوا: نفّذها؟</div><div class="row"><button class="btn ok" onclick="y++;f()">👍 <span id="yy">0</span></button><button class="btn r" onclick="nn++;f()">👎 <span id="nn">0</span></button></div><button class="btn" onclick="chaDone()">تأكيد</button>`,'cha');window.f=f}
function chaDone(){const w=y>nn;if(w){add(cur(),3);confetti()}end(`${cur().n} ${w?'+3 نجح 🎉':'التصويت مجاش في صالحه'}`)}

/* Mode 4 */
function gMind(){theme('mind');const q=draw('mind');S.q=q;S.v=[];S.vi=0;S.opts=q[1]||S.p.map(p=>p.a+' '+p.n);mindTurn()}
function mindTurn(){if(S.vi>=S.p.length)return mindShow();const p=S.p[S.vi];pass(p,'mindAsk()','أجاوب')}
function mindAsk(){show(`${head()}<div class="card big flip">${S.q[0]}</div><p style="text-align:center">إجابتك سرية 🤫</p>${S.opts.map((o,i)=>`<button class="btn g" onclick="S.v.push(${i});S.vi++;mindTurn()">${o}</button>`).join('')}`,'mind')}
function mindShow(){const c=S.opts.map((_,i)=>S.v.filter(v=>v==i).length),mx=Math.max(...c);
S.v.forEach((v,i)=>{if(c[v]==mx)add(S.p[i],2)});confetti();
show(`${head()}<div class="card big">${S.q[0]}</div><div class="card">${S.opts.map((o,i)=>`<div class="v"><span style="width:38%;font-size:14px">${o}</span><div class="bar"><i style="width:${c[i]/S.p.length*100}%"></i></div><b>${c[i]}</b></div>`).join('')}</div><p style="text-align:center">اللي اختار الأغلبية خد +2</p><button class="btn" onclick="S.i++;score()">كمّل</button>`,'mind')}
menu();
</script>
</body>
</html>
